<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 480" preserveAspectRatio="xMaxYMax slice">
  <!--
    Bottom-right page corner: large, smoky translucent discs that overlap, a violet
    glass disc on the right, and a streak of light where they cross.
    Colours are the site's violet ramp plus neutral smoke greys.
  -->
  <defs>
    <radialGradient id="smokeA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#3f3d57" stop-opacity="0.42"/>
      <stop offset="0.9" stop-color="#55536f" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8a88a5" stop-opacity="0.12"/>
    </radialGradient>
    <radialGradient id="smokeB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#2b2940" stop-opacity="0.36"/>
      <stop offset="0.92" stop-color="#55536f" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/>
    </radialGradient>
    <radialGradient id="haze" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glassViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.35" stop-color="#cfc4ff" stop-opacity="0.35"/>
      <stop offset="0.75" stop-color="#7c5cf5" stop-opacity="0.6"/>
      <stop offset="0.96" stop-color="#b7a6ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#efeaff" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="deepViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.4" stop-color="#2a0fa8" stop-opacity="0.75"/>
      <stop offset="0.9" stop-color="#4f1fe0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7c5cf5" stop-opacity="0.35"/>
    </radialGradient>
    <radialGradient id="flare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#efeaff" stop-opacity="0.85"/>
      <stop offset="0.65" stop-color="#7c5cf5" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4f1fe0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#cfc4ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="f1" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="f2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="f3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>

  <!-- pale haze the discs sit in -->
  <ellipse cx="640" cy="420" rx="520" ry="300" fill="url(#haze)" filter="url(#f3)"/>

  <!-- two large smoke discs; where they overlap the smoke is darkest -->
  <circle cx="470" cy="800" r="560" fill="url(#smokeB)" filter="url(#f1)"/>
  <circle cx="790" cy="700" r="520" fill="url(#smokeA)" filter="url(#f1)"/>
  <circle cx="470" cy="800" r="560" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.6"/>
  <circle cx="790" cy="700" r="520" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.8"/>
  <circle cx="620" cy="900" r="640" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.2"/>

  <!-- violet glass disc on the right, with a deeper violet disc behind its lower half -->
  <circle cx="1000" cy="640" r="330" fill="url(#deepViolet)" filter="url(#f1)"/>
  <circle cx="1030" cy="400" r="330" fill="url(#glassViolet)" filter="url(#f1)"/>
  <circle cx="1030" cy="400" r="330" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2"/>
  <circle cx="1000" cy="640" r="330" fill="none" stroke="#cfc4ff" stroke-opacity="0.6" stroke-width="1.4"/>

  <!-- light streak running into the crossing point, and its flare -->
  <rect x="250" y="322" width="520" height="5" rx="2.5" fill="url(#streak)" filter="url(#f1)" transform="rotate(-4 510 324)"/>
  <ellipse cx="716" cy="312" rx="150" ry="60" fill="url(#flare)" filter="url(#f2)" transform="rotate(-8 716 312)"/>
  <ellipse cx="716" cy="312" rx="60" ry="6" fill="#ffffff" opacity="0.95" filter="url(#f1)" transform="rotate(-6 716 312)"/>
</svg>
