<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660">
<defs>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="36"/></filter>
<filter id="fine" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="glassBack" x1="0.1" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.82"/><stop offset="0.45" stop-color="#efeaff" stop-opacity="0.5"/><stop offset="1" stop-color="#b7a6ff" stop-opacity="0.6"/></linearGradient>
<linearGradient id="glassFront" x1="0.9" y1="0" x2="0.1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="0.5" stop-color="#efeaff" stop-opacity="0.46"/><stop offset="1" stop-color="#cfc4ff" stop-opacity="0.55"/></linearGradient>
<linearGradient id="overlap" x1="0.5" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#b7a6ff" stop-opacity="0.25"/><stop offset="0.45" stop-color="#7c5cf5" stop-opacity="0.75"/><stop offset="1" stop-color="#4f1fe0" stop-opacity="0.95"/></linearGradient>
<linearGradient id="baseFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cf5" stop-opacity="0.75"/><stop offset="0.5" stop-color="#4f1fe0" stop-opacity="0.92"/><stop offset="1" stop-color="#14064f" stop-opacity="0.95"/></linearGradient>
<linearGradient id="hole" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#3f3d57" stop-opacity="0.34"/><stop offset="1" stop-color="#55536f" stop-opacity="0.12"/></linearGradient>
<clipPath id="inBack"><path clip-rule="evenodd" d="M 48 372 a 252 240 0 1 0 504 0 a 252 240 0 1 0 -504 0 Z M 162 366 a 150 140 0 1 0 300 0 a 150 140 0 1 0 -300 0 Z"/></clipPath>
<clipPath id="inBase"><path clip-rule="evenodd" d="M 226 468 a 226 150 0 1 0 452 0 a 226 150 0 1 0 -452 0 Z M 324 452 a 128 66 0 1 0 256 0 a 128 66 0 1 0 -256 0 Z"/></clipPath>
</defs>
<ellipse cx="370" cy="350" rx="290" ry="260" fill="#7c5cf5" opacity="0.26" filter="url(#glow)"/>
<path fill-rule="evenodd" d="M 48 372 a 252 240 0 1 0 504 0 a 252 240 0 1 0 -504 0 Z M 162 366 a 150 140 0 1 0 300 0 a 150 140 0 1 0 -300 0 Z" fill="#14122b" opacity="0.2" filter="url(#soft)" transform="translate(10 22)"/>

<!-- deep violet ring lying behind, at the bottom -->
<path fill-rule="evenodd" d="M 226 468 a 226 150 0 1 0 452 0 a 226 150 0 1 0 -452 0 Z M 324 452 a 128 66 0 1 0 256 0 a 128 66 0 1 0 -256 0 Z" fill="url(#baseFill)"/>

<path d="M 226 468 a 226 150 0 1 0 452 0 a 226 150 0 1 0 -452 0 Z" fill="none" stroke="#ffffff" stroke-width="2.4" opacity="0.54"/>
<path d="M 324 452 a 128 66 0 1 0 256 0 a 128 66 0 1 0 -256 0 Z" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.44999999999999996"/>

<!-- smoke seen through the holes -->
<path d="M 162 366 a 150 140 0 1 0 300 0 a 150 140 0 1 0 -300 0 Z" fill="url(#hole)"/>
<path d="M 308 240 a 122 134 0 1 0 244 0 a 122 134 0 1 0 -244 0 Z" fill="url(#hole)"/>

<!-- back ring -->
<path fill-rule="evenodd" d="M 48 372 a 252 240 0 1 0 504 0 a 252 240 0 1 0 -504 0 Z M 162 366 a 150 140 0 1 0 300 0 a 150 140 0 1 0 -300 0 Z" fill="url(#glassBack)"/>
<path fill-rule="evenodd" d="M 48 372 a 252 240 0 1 0 504 0 a 252 240 0 1 0 -504 0 Z M 162 366 a 150 140 0 1 0 300 0 a 150 140 0 1 0 -300 0 Z" fill="url(#overlap)" clip-path="url(#inBase)" opacity="0.85"/>

<!-- front ring, turning violet where it crosses the other two -->
<path fill-rule="evenodd" d="M 216 246 a 208 218 0 1 0 416 0 a 208 218 0 1 0 -416 0 Z M 308 240 a 122 134 0 1 0 244 0 a 122 134 0 1 0 -244 0 Z" fill="url(#glassFront)"/>
<path fill-rule="evenodd" d="M 216 246 a 208 218 0 1 0 416 0 a 208 218 0 1 0 -416 0 Z M 308 240 a 122 134 0 1 0 244 0 a 122 134 0 1 0 -244 0 Z" fill="url(#overlap)" clip-path="url(#inBack)"/>
<path fill-rule="evenodd" d="M 216 246 a 208 218 0 1 0 416 0 a 208 218 0 1 0 -416 0 Z M 308 240 a 122 134 0 1 0 244 0 a 122 134 0 1 0 -244 0 Z" fill="url(#overlap)" clip-path="url(#inBase)" opacity="0.7"/>

<!-- soft sheen along the upper-left of each band -->
<path d="M 86 300 A 252 240 0 0 1 300 132" fill="none" stroke="#ffffff" stroke-width="22" opacity="0.3" stroke-linecap="round" filter="url(#fine)"/>
<path d="M 250 150 A 208 218 0 0 1 424 28" fill="none" stroke="#ffffff" stroke-width="18" opacity="0.34" stroke-linecap="round" filter="url(#fine)"/>

<path d="M 48 372 a 252 240 0 1 0 504 0 a 252 240 0 1 0 -504 0 Z" fill="none" stroke="#ffffff" stroke-width="2.4" opacity="0.9"/>
<path d="M 162 366 a 150 140 0 1 0 300 0 a 150 140 0 1 0 -300 0 Z" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.75"/>
<path d="M 216 246 a 208 218 0 1 0 416 0 a 208 218 0 1 0 -416 0 Z" fill="none" stroke="#ffffff" stroke-width="2.4" opacity="0.9"/>
<path d="M 308 240 a 122 134 0 1 0 244 0 a 122 134 0 1 0 -244 0 Z" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.75"/>

<!-- light where the rings cross -->
<ellipse cx="392" cy="452" rx="120" ry="16" fill="#cfc4ff" opacity="0.7" filter="url(#fine)" transform="rotate(-18 392 452)"/>
<path d="M300 486 C 370 470, 440 440, 520 396" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
</svg>
